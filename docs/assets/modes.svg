<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Insomnia menu-bar utility illustration</title>
  <desc id="desc">Illustrative menu showing Normal, Server and Travel modes, a timer and iPhone connection settings. No real device or network data is shown.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#e5e9f1"/><stop offset="1" stop-color="#d5dce8"/></linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%"><feDropShadow dy="12" stdDeviation="16" flood-opacity=".16"/></filter>
  </defs>
  <rect width="720" height="420" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="64" y="80" font-size="27" font-weight="600" fill="#273247">Insomnia</text>
    <text x="64" y="110" font-size="13" fill="#64718a">Three modes.</text>
    <text x="64" y="132" font-size="13" fill="#64718a">Explicit recovery.</text>
    <text x="64" y="164" font-size="11" fill="#75829a">Experimental macOS utility</text>
    <g transform="translate(302 42)">
      <rect width="350" height="304" rx="14" fill="#f7f8fb" stroke="#c3ccda" filter="url(#shadow)"/>
      <text x="20" y="32" font-size="14" font-weight="600" fill="#283246">Insomnia · Обычный</text>
      <text x="20" y="54" font-size="11" fill="#748097">Таймер не активен</text>
      <path d="M14 68h322" stroke="#dce1ea"/>
      <rect x="10" y="77" width="330" height="30" rx="7" fill="#e4ecf8"/>
      <text x="21" y="97" font-size="13" fill="#2e5a98">✓  Обычный</text>
      <text x="21" y="132" font-size="13" fill="#283246">Сервер</text>
      <text x="21" y="166" font-size="13" fill="#283246">В пути</text>
      <path d="M14 181h322" stroke="#dce1ea"/>
      <text x="21" y="207" font-size="13" fill="#283246">Таймер</text><text x="320" y="207" font-size="15" fill="#7a879c">›</text>
      <text x="21" y="239" font-size="13" fill="#283246">Связь с iPhone</text><text x="320" y="239" font-size="15" fill="#7a879c">›</text>
      <text x="21" y="271" font-size="13" fill="#283246">Настройки</text><text x="320" y="271" font-size="15" fill="#7a879c">›</text>
    </g>
    <text x="360" y="388" text-anchor="middle" font-size="11" fill="#68768e">Illustration only · no real SSID, password, or device log</text>
  </g>
</svg>
